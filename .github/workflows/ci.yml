name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: barberflow
          POSTGRES_PASSWORD: barberflow_ci
          POSTGRES_DB: barberflow
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U barberflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://barberflow:barberflow_ci@localhost:5432/barberflow?schema=public
      JWT_SECRET: ci-only-secret-with-more-than-32-characters
      WEB_ORIGIN: http://localhost:3000
      PORT: 4000
      SEED_ADMIN_EMAIL: admin@barberflow.test
      SEED_ADMIN_PASSWORD: ci-admin-password-123
      NEXT_PUBLIC_API_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy --schema apps/api/prisma/schema.prisma
      - run: npm run db:seed
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:e2e
      - run: npm audit --audit-level=high
